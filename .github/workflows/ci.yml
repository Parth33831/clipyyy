name: CI

concurrency:
  group: clipyyy-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast feedback for normal development: lint plus tests for the changed
  # selection/render paths. This avoids reinstalling every platform on each commit.
  fast-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q tests/test_selection.py tests/test_render.py tests/test_transcribe.py tests/test_vision.py tests/test_llm.py tests/test_campaign.py tests/test_campaign_link.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Full validation is available on demand before releases or larger changes.
  full-backend:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --python 3.12
      - run: uv run pytest -q

  # Macs. Homebrew's standard ffmpeg has no libass. Installing it first reproduces the
  # common case: ffmpeg-full then sits beside it, off the PATH, and clipyyy must find it.
  macos:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: brew install ffmpeg && brew install ffmpeg-full
      - run: uv sync --python 3.12
      - run: uv run clipyyy doctor || true  # an AI key is not set in CI
      - run: uv run python -c "from clipyyy.media import find_ffmpeg as f; r = f(); print(r); assert r.libass and 'ffmpeg-full' in r.ffmpeg"
      - run: uv run python -c "import faster_whisper, importlib.util as u, platform, sys; intel = sys.platform == 'darwin' and platform.machine() == 'x86_64'; found = u.find_spec('mediapipe') is not None; print('mediapipe', found); assert found != intel"
      - run: uv run pytest -q

  # Windows is the primary desktop target; validate it on demand and before releases.
  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: choco install ffmpeg -y --no-progress
      - run: uv sync --python 3.12
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - name: Validate Windows startup PowerShell scripts
        shell: pwsh
        run: |
          $files = @('scripts/windows/Install-Startup.ps1', 'scripts/windows/Uninstall-Startup.ps1', 'scripts/windows/Update-Clipyyy.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Format-List | Out-String) }
          }
      - run: uv run pytest -vv --full-trace
